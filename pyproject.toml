[tool.poetry]
name = "headhunterdb"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.3"
psycopg2 = "^2.9.10"
pandas = "^2.2.3"
python-dotenv = "^1.0.1"
types-psycopg2 = "^2.9.21.20250121"
types-requests = "^2.32.0.20241016"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.1.1"
mypy = "^1.15.0"
black = "^25.1.0"
isort = "^6.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untiped_defs = true
no_implicit_any = true
warn_return_any = true
exclude = "venv"
check_untyped_defs = true
warn_unreachable = true

[tool.black]
line-length = 119
exclude = ".git"

[tool.isort]
line_length = 119


